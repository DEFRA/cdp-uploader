name: Publish

on:
  push:
    branches:
      - main
  # Re-run the API docs publish by hand (the image build is skipped)
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1 && github.event_name != 'workflow_dispatch'
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Builds the static API docs site and publishes it to the CDP API hub bucket.
  # Building and publishing (the last two steps) are kept separate.
  publish-api-docs:
    name: Publish API docs
    needs: build
    # Runs after a successful image build, or on its own when started by hand.
    # main only: a manual run from another branch would overwrite the released docs
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history and tags: needed for the diff below and the version
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Cheap check first, so unrelated pushes skip the npm installs and the build
      - name: Check for API docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Publish by default. Skip only when we can compare and nothing relevant changed
          # (a manual run, no previous commit or a missing one all fall through to publish)
          changed=true
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" "$SHA" -- docs/ src/ scripts/generate-openapi.js package.json package-lock.json .github/workflows/publish.yml; then
            changed=false
            echo "No API docs were published, nothing that shapes them has changed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

      # The build job has already tagged this commit. Require that exact tag: an older
      # one would overwrite that release's docs (a manual run on an untagged commit fails)
      - name: Resolve version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          VERSION="$(git describe --tags --exact-match HEAD)"
          echo "Publishing API docs as version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # The docs theme is locked as an ssh git URL and the runner has no ssh key, so fetch it over https
      - name: Use https for GitHub dependencies
        if: steps.changes.outputs.changed == 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Generate OpenAPI spec
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run docs:openapi

      # The site's links and assets are absolute, so build it once per path it is
      # served from by cdp-api-docs: /api/<service>/latest/ and /api/<service>/<version>/
      - name: Build API docs site
        if: steps.changes.outputs.changed == 'true'
        working-directory: docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run gen:api
          DOCS_BASE_URL=/api/cdp-uploader/latest/ npx docusaurus build --out-dir build-latest
          DOCS_BASE_URL="/api/cdp-uploader/$VERSION/" npx docusaurus build --out-dir build-versioned

      # Order matters: the action always writes /<version>/ too, so this call
      # leaves the /latest/ build there and the next call replaces it.
      # Once publish-api-docs can skip the versioned copy, skip it here and the order stops mattering.
      - name: Publish API docs (latest)
        if: steps.changes.outputs.changed == 'true'
        uses: DEFRA/cdp-build-action/publish-api-docs@main
        with:
          path: ./docs/build-latest
          version: ${{ steps.version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API docs (versioned)
        if: steps.changes.outputs.changed == 'true'
        uses: DEFRA/cdp-build-action/publish-api-docs@main
        with:
          path: ./docs/build-versioned
          version: ${{ steps.version.outputs.version }}
          update-latest: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
