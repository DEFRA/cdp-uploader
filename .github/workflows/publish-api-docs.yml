name: Publish API docs

# Builds the static API docs site and publishes it to the CDP API hub bucket.
# Kept apart from Publish: it runs once that workflow has built and tagged a release.
on:
  workflow_run:
    workflows:
      - Publish
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

# One publish at a time, so an older run can't overwrite newer docs in latest/
concurrency:
  group: publish-api-docs
  cancel-in-progress: false

jobs:
  publish-api-docs:
    name: Publish API docs
    # After a successful Publish run, or by hand. main only: a manual run from
    # another branch would overwrite the released docs
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history and tags: needed by api-docs-version.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and publish API docs
        uses: DEFRA/cdp-build-action/api-docs@main
