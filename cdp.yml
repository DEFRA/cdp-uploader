# cdp.yml: CDP settings for this repo. Lives in the repo root.
apiDocs:
  # Site name in the GOV.UK header and the browser tab.
  # Default: repo name turned into words, e.g. cdp-uploader -> "Cdp Uploader".
  title: CDP Uploader API Docs

  # Short description used in the page metadata.
  # Default: info.title from the spec, otherwise "API documentation for <title from repo name>".
  tagline: Upload and virus scan files for CDP services

  # Phase tag on the GOV.UK banner under the header, e.g. alpha or beta.
  # Default: beta. Any text works; it is shown as the tag.
  phase: live
